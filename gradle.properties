org.gradle.jvmargs=--add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

# Lets Gradle's toolchain auto-detection (see build.gradle's useJdkVersion handling) find a JDK
# from a plain JAVA_HOME_<version>_X64 env var, e.g. for local -PuseJdkVersion=<N> testing without
# hand-writing a Maven toolchains.xml. Not needed in CI: actions/setup-java writes that file for
# every JDK it installs, and Gradle's default "Maven Toolchains" auto-detection already finds it
# there, regardless of this property. Harmless when unset: Gradle silently ignores any of these
# env vars that aren't actually set.
org.gradle.java.installations.fromEnv=JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
