org.gradle.jvmargs=--add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

# Lets Gradle's toolchain auto-detection (see build.gradle's useJdkVersion handling) find a JDK
# that actions/setup-java installed in CI, via the JAVA_HOME_<version>_X64 env var it sets,
# instead of redundantly auto-downloading its own copy of the same JDK. Harmless locally: Gradle
# silently ignores any of these that aren't actually set.
org.gradle.java.installations.fromEnv=JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
