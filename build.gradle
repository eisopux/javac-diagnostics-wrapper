/*
 * javac diagnostics wrapper project build file.
 */

plugins {
    id 'java'
    id 'application'
    id 'eclipse'
    id 'maven-publish'
    id 'signing'
    // https://plugins.gradle.org/plugin/com.gradleup.shadow
    id 'com.gradleup.shadow' version '9.4.1'
    id 'com.diffplug.spotless' version '8.10.2'
    id 'net.ltgt.errorprone' version '5.1.0'
}

// The Maven Central namespace this project publishes under. Verified for the `eisopux` GitHub
// org specifically -- distinct from (and not to be confused with) `io.github.eisop`, which is
// checker-framework's own, separately-verified namespace.
group = 'io.github.eisopux'
version = '0.1.0-SNAPSHOT'

// The JDK to compile and run with, defaulting to whichever JVM is currently running Gradle (the
// usual case for a local `./gradlew build`). CI instead always runs Gradle under one fixed JDK
// and passes this explicitly via -PuseJdkVersion (or ORG_GRADLE_PROJECT_useJdkVersion) once per
// JDK in the support matrix, the same way eisop/checker-framework's build.gradle does -- this
// project's Gradle version requires JDK 17+ to run at all, so it could not run directly under an
// older JDK like 11 even if we wanted it to.
int currentRuntimeJavaVersion = JavaVersion.current().majorVersion as int
String useJdkVersionProp = findProperty('useJdkVersion')
int useJdkVersionInt = useJdkVersionProp == null ? currentRuntimeJavaVersion : (useJdkVersionProp as int)

repositories {
    mavenCentral()
    maven {
        // Publishes com.jetbrains.qodana:qodana-sarif (SarifReporter's SARIF 2.1.0 model), which
        // is not mirrored to Maven Central. See SarifReporter's class Javadoc before adding any
        // further dependency on this library elsewhere.
        url = 'https://packages.jetbrains.team/maven/p/ij/intellij-dependencies'
        content {
            includeGroup 'com.jetbrains.qodana'
        }
    }
}

configurations {
    // Deliberately not `implementation`/`compileOnly`/`testImplementation`: the packaged
    // application has no dependency on the Checker Framework. This configuration exists only to
    // put it on the classpath the checkerFrameworkDemo task below passes to SarifDiagnostics as
    // an annotation processor, the same way any other caller of the packaged jar would. See
    // demo/checker-framework/README.md.
    checkerFrameworkDemo
}

dependencies {
    implementation 'com.google.code.gson:gson:2.14.0'
    // Experimental: see SarifReporter's class Javadoc for why this is confined to one file.
    implementation 'com.jetbrains.qodana:qodana-sarif:1.0.33'
    testImplementation 'junit:junit:4.13.2'
    checkerFrameworkDemo 'io.github.eisop:checker:3.49.5-eisop1'
    // error_prone_core's class files require a JDK 21+ JVM to load, regardless of the "supports
    // JDK 17+ sources" the net.ltgt.errorprone plugin advertises -- confirmed by actually running
    // this dependency's compiler plugin under a JDK 17 toolchain (UnsupportedClassVersionError,
    // class file version 65.0 i.e. Java 21). Keep this in sync with options.errorprone.enabled
    // below: they drifted out of sync once before (eisopux/javac-diagnostics-wrapper#134), when
    // CI never actually built under anything but JDK 21 and so never caught the mismatch.
    if (useJdkVersionInt >= 21) {
        errorprone('com.google.errorprone:error_prone_core:2.50.0')
    }
}

application {
    // Define the main class for the application
    mainClass = 'io.github.eisopux.diagnostics.builtin.JsonDiagnostics'
}

java {
    // Maven Central requires both alongside the compiled jar.
    withJavadocJar()
    withSourcesJar()
}

boolean useToolchains = (currentRuntimeJavaVersion != useJdkVersionInt)
if (useToolchains) {
    // On CI, Gradle always runs under one fixed JDK and a different JDK is selected as a
    // toolchain, to actually build and run under each JDK in the support matrix rather than
    // only ever under whichever JDK Gradle itself happens to run on.
    // See https://docs.gradle.org/current/userguide/toolchains.html
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(useJdkVersionInt)
        }
    }

    // JavaExec (smokeTest, checkerFrameworkDemo) does not automatically inherit the toolchain JDK.
    tasks.withType(JavaExec).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(useJdkVersionInt)
        }
    }
    // JavaCompile also needs an explicit nudge.
    tasks.withType(JavaCompile).configureEach {
        javaCompiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(useJdkVersionInt)
        }
    }
}

tasks.withType(JavaCompile) { compilationTask ->
    options.compilerArgs += ['-Xlint:-options', '-Werror']
    options.errorprone.enabled = useJdkVersionInt >= 21
    sourceCompatibility = 8
    targetCompatibility = 8
}

shadowJar {
}

// Gradle's `build`/`assemble` only compile and package the application; they never execute it,
// so a mainClass that names a nonexistent class (or any other startup failure) is otherwise
// invisible until someone actually runs the packaged jar or `./gradlew run`. This runs the real
// application against a trivial fixture file and fails the build if it exits non-zero.
tasks.register('smokeTest', JavaExec) {
    description = 'Runs the packaged application against a trivial file to catch a broken mainClass or other startup failure.'
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    workingDir = rootDir
    // Without an explicit -d, javac writes Smoke.class next to Smoke.java, littering the source
    // tree on every run.
    args = [
        '-d',
        "${buildDir}/smokeTest",
        'smoketest/Smoke.java'
    ]
}

check.dependsOn smokeTest

// Demonstrates -- and regression-tests -- using SarifDiagnostics together with two EISOP Checker
// Framework checkers (Nullness and Interning) run as annotation processors at once, entirely from
// the checkerFrameworkDemo configuration above; the packaged application itself has no Checker
// Framework dependency. See demo/checker-framework/README.md for the full explanation, including
// why -Awarns is required to get findings from both checkers in one run, and how to run this by
// hand.
tasks.register('checkerFrameworkDemo', JavaExec) {
    description = 'Runs the Nullness and Interning Checkers on the demo files through SarifDiagnostics and checks the SARIF output.'
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.eisopux.diagnostics.builtin.SarifDiagnostics'
    workingDir = rootDir
    // Demo.java, InterningError.java, and OtherError.java each have an intentional error, so
    // SarifDiagnostics is expected to exit 1; that is not this task's failure.
    ignoreExitValue = true
    // The Checker Framework reaches into javac internals not exported by default on JDK 16+.
    jvmArgs = [
        'com.sun.tools.javac.api',
        'com.sun.tools.javac.code',
        'com.sun.tools.javac.comp',
        'com.sun.tools.javac.file',
        'com.sun.tools.javac.main',
        'com.sun.tools.javac.parser',
        'com.sun.tools.javac.processing',
        'com.sun.tools.javac.tree',
        'com.sun.tools.javac.util'
    ].collect { "--add-opens=jdk.compiler/${it}=ALL-UNNAMED" }
    args = [
        '-classpath',
        configurations.checkerFrameworkDemo.asPath,
        '-processor',
        'org.checkerframework.checker.nullness.NullnessChecker,org.checkerframework.checker.interning.InterningChecker',
        // See demo/checker-framework/InterningError.java's Javadoc for why this is required to
        // get findings from both checkers, rather than javac stopping after the first one's.
        '-Awarns',
        // Without this, both checkers' dereference.of.nullable-style findings would carry only
        // their bare message key as ruleId, with no way to tell which checker reported which --
        // see SarifReporter's class Javadoc for the "checker" property this enables.
        '-AshowPrefixInWarningMessages',
        'demo/checker-framework/Demo.java',
        'demo/checker-framework/InterningError.java',
        'demo/checker-framework/OtherError.java'
    ]

    def outputFile = file("${buildDir}/demo/checker-framework-nullness.sarif.json")
    doFirst {
        outputFile.parentFile.mkdirs()
        standardOutput = new FileOutputStream(outputFile)
    }
    doLast {
        String sarif = outputFile.text
        // One finding from each of two different checkers (each one's own message key as ruleId,
        // plus a "checker" property naming which one) and one plain javac diagnostic (its raw
        // code as ruleId, no "checker" property) -- see OtherError.java's Javadoc for why that
        // one must be a separate finding from the other two.
        List<String> expectedRuleIds = [
            'dereference.of.nullable',
            'not.interned',
            'compiler.err.prob.found.req'
        ]
        List<String> missing = expectedRuleIds.findAll {
            !sarif.contains("\"ruleId\": \"${it}\"")
        }
        List<String> expectedCheckers = ['nullness', 'interning']
        missing += expectedCheckers.findAll {
            !sarif.contains("\"checker\": \"${it}\"")
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Expected SARIF results with ruleId/checker ${missing}; got:\n${sarif}")
        }
        logger.lifecycle("Wrote SARIF demo output to ${outputFile}")
    }
}

check.dependsOn checkerFrameworkDemo

// Publishing configuration, modeled on eisop/checker-framework's gradle-mvn-push.gradle (see
// https://github.com/eisop/checker-framework/blob/master/docs/developer/maven-central-publishing.md
// for the full one-time maintainer setup this depends on: a Maven Central Portal account with
// publish rights on the io.github.eisopux namespace, and a GPG key on a public keyserver). This
// project has only one publishable module, so unlike checker-framework's multi-project setup,
// everything lives inline here rather than in a separate shared script.
final isSnapshot = version.toString().endsWith('SNAPSHOT')

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'javac diagnostics wrapper'
                description = 'A customizable wrapper around javac that aggregates and outputs ' +
                        'compiler diagnostics in a desired format using a pluggable architecture.'
                url = 'https://eisopux.github.io/'
                licenses {
                    license {
                        name = 'GNU General Public License, version 2'
                        url = 'https://www.gnu.org/licenses/old-licenses/gpl-2.0.html'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'wmdietl'
                        name = 'Werner M. Dietl'
                        email = 'wdietl@gmail.com'
                        url = 'https://ece.uwaterloo.ca/~wdietl/'
                        organization = 'University of Waterloo'
                        organizationUrl = 'https://uwaterloo.ca/electrical-computer-engineering/'
                    }
                }
                scm {
                    url = 'https://github.com/eisopux/javac-diagnostics-wrapper.git'
                    connection = 'scm:git:https://github.com/eisopux/javac-diagnostics-wrapper.git'
                    developerConnection = 'scm:git:ssh://git@github.com/eisopux/javac-diagnostics-wrapper.git'
                }
            }
        }
    }
    repositories {
        maven {
            url = (isSnapshot
            ? (findProperty('SNAPSHOT_REPOSITORY_URL') ?: 'https://central.sonatype.com/repository/maven-snapshots/')
            : (findProperty('RELEASE_REPOSITORY_URL') ?: 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/')
            )
            credentials {
                username = findProperty('SONATYPE_NEXUS_USERNAME')
                password = findProperty('SONATYPE_NEXUS_PASSWORD')
            }
        }
    }
}

signing {
    // Use external gpg cmd. This makes it easy to use gpg-agent, to avoid being prompted for a
    // password once per artifact.
    useGpgCmd()

    // If anything about signing is misconfigured, fail loudly rather than quietly continuing with
    // unsigned artifacts.
    required = true

    sign publishing.publications.mavenJava
}

// Only sign releases; snapshots are unsigned.
tasks.withType(Sign).configureEach {
    onlyIf {
        !isSnapshot && project.hasProperty('release')
    }
    doFirst {
        // Any maintainer may sign a release, each with their own key, so no key is hardcoded.
        // Require the key to be named explicitly: otherwise gpg falls back to whichever secret
        // key happens to be its default, which may not be one Maven Central can verify.
        if (!project.hasProperty('signing.gnupg.keyName')) {
            throw new GradleException(
            'signing.gnupg.keyName is not set, so gpg would sign with its default key.\n' +
            'Set it to your own key, either in ~/.gradle/gradle.properties or as\n' +
            '-Psigning.gnupg.keyName=<key id or email>.')
        }
    }
}

// Regression-tests the publication itself (POM metadata, javadoc/sources jars, ...) on every
// build, the same way smokeTest and checkerFrameworkDemo regression-test other parts of the
// project. Needs no credentials or signing: it only writes to the local ~/.m2 repository, and
// signing is skipped for a snapshot version without -Prelease (see above).
check.dependsOn publishToMavenLocal

spotless {
    java {
        googleJavaFormat().aosp()
        importOrder('com', 'jdk', 'lib', 'lombok', 'org', 'java', 'javax')
        formatAnnotations()
    }
    groovyGradle {
        target '*.gradle'
        importOrder()
        greclipse() // which formatter Spotless should use to format .gradle files.
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
    }
}

eclipse.classpath {
    defaultOutputDir = file("build/default")
    file.whenMerged { cp ->
        cp.entries.forEach { cpe ->
            if (cpe instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder) {
                cpe.output = cpe.output.replace "bin/", "build/classes/java/"
            }
            if (cpe instanceof org.gradle.plugins.ide.eclipse.model.Output) {
                cpe.path = cpe.path.replace "bin/", "build/"
            }
        }
    }
}
