/*
 * javac diagnostics wrapper project build file.
 */

plugins {
    id 'java'
    id 'application'
    id 'eclipse'
    // https://plugins.gradle.org/plugin/com.gradleup.shadow
    id 'com.gradleup.shadow' version '9.4.1'
    id 'com.diffplug.spotless' version '8.10.2'
    id 'net.ltgt.errorprone' version '5.1.0'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.14.0'
    testImplementation 'junit:junit:4.13.2'
    if (JavaVersion.current() >= JavaVersion.VERSION_21) {
        errorprone('com.google.errorprone:error_prone_core:2.50.0')
    }
}

application {
    // Define the main class for the application
    mainClass = 'io.github.eisopux.diagnostics.builtin.JsonDiagnostics'
}

tasks.withType(JavaCompile) { compilationTask ->
    options.compilerArgs += ['-Xlint:-options', '-Werror']
    options.errorprone.enabled = JavaVersion.current() >= JavaVersion.VERSION_17
    sourceCompatibility = 8
    targetCompatibility = 8
}

shadowJar {
}

// Gradle's `build`/`assemble` only compile and package the application; they never execute it,
// so a mainClass that names a nonexistent class (or any other startup failure) is otherwise
// invisible until someone actually runs the packaged jar or `./gradlew run`. This runs the real
// application against a trivial fixture file and fails the build if it exits non-zero.
tasks.register('smokeTest', JavaExec) {
    description = 'Runs the packaged application against a trivial file to catch a broken mainClass or other startup failure.'
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    workingDir = rootDir
    // Without an explicit -d, javac writes Smoke.class next to Smoke.java, littering the source
    // tree on every run.
    args = [
        '-d',
        "${buildDir}/smokeTest",
        'smoketest/Smoke.java'
    ]
}

check.dependsOn smokeTest

spotless {
    java {
        googleJavaFormat().aosp()
        importOrder('com', 'jdk', 'lib', 'lombok', 'org', 'java', 'javax')
        formatAnnotations()
    }
    groovyGradle {
        target '*.gradle'
        importOrder()
        greclipse() // which formatter Spotless should use to format .gradle files.
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
    }
}

eclipse.classpath {
    defaultOutputDir = file("build/default")
    file.whenMerged { cp ->
        cp.entries.forEach { cpe ->
            if (cpe instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder) {
                cpe.output = cpe.output.replace "bin/", "build/classes/java/"
            }
            if (cpe instanceof org.gradle.plugins.ide.eclipse.model.Output) {
                cpe.path = cpe.path.replace "bin/", "build/"
            }
        }
    }
}
